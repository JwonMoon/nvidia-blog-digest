name: Daily NVIDIA blog digest

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify Claude auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "Reply with exactly OK" | claude -p --output-format text --model sonnet

      - name: Run digest pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 특정 카테고리만 수집하려면 주석 해제 후 수정 (쉼표 구분, 부분 일치)
          # DIGEST_CATEGORIES: "Generative AI, Robotics, CUDA"
        run: python scripts/run_digest.py

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests state/seen.json index.md
          if git diff --cached --quiet; then
            echo "no changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            TODAY=$(TZ=Asia/Seoul date +%F)
            git commit -m "digest: $TODAY"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          fi

      - name: Email digest
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          subject: "NVIDIA 블로그 요약 — ${{ steps.commit.outputs.today }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: NVIDIA Blog Digest
          body: "file://digests/${{ steps.commit.outputs.today }}.md"
